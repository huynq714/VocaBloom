<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    .touch-target {
      min-height: 48px;
      min-width: 48px;
    }
    input::placeholder {

      opacity: 0.7;
    }

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col justify-between items-center selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Mobile Container: Calibrated for Pixel 4a (393px typical width viewport) -->
<main class="w-full max-w-[420px] min-h-screen flex flex-col justify-between bg-surface px-margin pb-6 pt-4 relative mx-auto">
<!-- Top Bar: Shared Component Representation (Supressed BottomNavBar as this is Linear Login Flow) -->
<header class="flex justify-between items-center w-full h-14">
<button aria-label="Quay lại" class="touch-target flex items-center justify-center rounded-full hover:bg-surface-container-high active:scale-95 transition-transform duration-150 text-on-surface-variant" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Brand Minimal Anchor -->
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-primary" data-icon="local_fire_department" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-headline-sm text-headline-sm text-primary font-bold tracking-tight">VocaBloom</span>
</div>
<!-- Balanced spacer or help icon -->
<button aria-label="Hỗ trợ" class="touch-target flex items-center justify-center rounded-full hover:bg-surface-container-high text-on-surface-variant" type="button">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- Main Content Flow -->
<div class="flex-1 flex flex-col justify-center py-4">
<!-- Editorial Header Section -->
<section class="text-center mb- space-lg">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-primary-fixed text-primary mb-3 shadow-sm border border-outline-variant/40">
<!-- Stylized blooming leaf / blossom insignia -->
<span class="material-symbols-outlined text-primary text-3xl" data-icon="spa" data-weight="fill" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight">
          Chào mừng trở lại
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 max-w-[280px] mx-auto">
          Tiếp tục hành trình làm chủ vốn từ của bạn
        </p>
</section>
<!-- Login Form Card (Elevation Level 1 with subtle border) -->
<div class="bg-surface-container-lowest rounded-xl p-5 border border-surface-variant shadow-[0px_2px_6px_rgba(30,35,32,0.04),0px_1px_2px_rgba(30,35,32,0.03)] space-y-4">
<form class="space-y-4" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email / Username Field -->
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface font-semibold" for="identity">
              Email hoặc tên đăng nhập
            </label>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl" data-icon="mail">mail</span>
</div>
<input autocomplete="username" class="w-full h-[52px] pl-11 pr-4 bg-surface-container-lowest text-on-surface font-body-md text-body-md border border-surface-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-150 outline-none" id="identity" name="identity" placeholder="ví dụ: lananh@vocabloom.vn" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface font-semibold" for="password">
                Mật khẩu
              </label>
</div>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-[52px] pl-11 pr-12 bg-surface-container-lowest text-on-surface font-body-md text-body-md border border-surface-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-150 outline-none" id="password" name="password" placeholder="Nhập mật khẩu của bạn" required="" type="password">
<!-- Toggle Password Visibility Button -->
<button aria-label="Ẩn hoặc hiện mật khẩu" class="absolute right-1 w-11 h-11 flex items-center justify-center text-outline hover:text-on-surface rounded-full transition-colors active:scale-95" id="togglePassword" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility" id="eyeIcon">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="font-label-md text-label-md text-primary font-semibold hover:underline active:opacity-80" href="#">
                Quên mật khẩu?
              </a>
</div>
</div>
<!-- Primary Action Button: 52dp height, burnt orange, active state -->
<button class="w-full h-[52px] bg-primary text-on-primary font-label-lg text-label-lg font-bold rounded-xl shadow-sm hover:bg-primary-container active:scale-[0.98] transition-all duration-150 flex items-center justify-center space-x-2 mt-2" type="submit">
<span class="">Đăng nhập</span>
<span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider Section -->

<!-- Social Quick Login Button: Google -->

</div>
<!-- Quick Mnemonic / Daily Quote Minimal Badge -->
<div class="mt-4 p-3 bg-surface-container-low rounded-lg border border-surface-variant flex items-center space-x-3">
<span class="material-symbols-outlined text-primary flex-shrink-0" data-icon="auto_stories">auto_stories</span>
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1 italic">
          “Mỗi từ mới hôm nay là một bước tiến ngày mai.”
        </p>
</div>
</div>
<!-- Screen Footer / Sign-up navigation anchor -->
<footer class="pt-4 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        Chưa có tài khoản?
        <a class="font-label-lg text-label-lg text-primary font-bold hover:underline active:opacity-80 ml-1" href="#">
          Đăng ký ngay
        </a>
</p>
<!-- Android API 34 Gesture Bar Ergonomic Inset Buffer -->
<div aria-hidden="true" class="w-32 h-1 bg-on-surface/20 rounded-full mx-auto mt-5"></div>
</footer>
</main>
<!-- Interactive script for password reveal & subtle feedback -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePasswordBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (togglePasswordBtn && passwordInput && eyeIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          if (isPassword) {
            passwordInput.setAttribute('type', 'text');
            eyeIcon.textContent = 'visibility_off';
            eyeIcon.setAttribute('data-icon', 'visibility_off');
          } else {
            passwordInput.setAttribute('type', 'password');
            eyeIcon.textContent = 'visibility';
            eyeIcon.setAttribute('data-icon', 'visibility');
          }
        });
      }
    });
  </script>


</body></html>
