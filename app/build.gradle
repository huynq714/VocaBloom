plugins { id 'com.android.application' }
// Add app/google-services.json from YOUR Firebase project to enable Firebase.
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
    namespace 'com.vocabloom.app'
    compileSdk 35
    defaultConfig { applicationId 'com.vocabloom.app'; minSdk 24; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
}
